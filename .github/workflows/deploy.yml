name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Apply D1 migrations to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc
      - name: Deploy to Cloudflare Workers
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESULTS_API_TOKEN: ${{ secrets.RESULTS_API_TOKEN }}
        run: |
          # The write token for the Results API is synced from the GitHub secret on every deploy.
          set -o pipefail
          [ -n "$RESULTS_API_TOKEN" ] || { echo "RESULTS_API_TOKEN secret is not set"; exit 1; }
          secrets="$RUNNER_TEMP/worker-secrets.json"
          node -e 'require("fs").writeFileSync(process.argv[1], JSON.stringify({ RESULTS_API_TOKEN: process.env.RESULTS_API_TOKEN }))' "$secrets"
          npx wrangler deploy --message "main @ ${GITHUB_SHA::7}" --secrets-file "$secrets" | tee deploy.log
          rm -f "$secrets"
          url=$(grep -Eo 'https://portfolio\.aswin-qa\.workers\.dev' deploy.log | head -1)
          [ -n "$url" ] || { echo "Could not find the workers.dev URL in the deploy output"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production: $url" >> "$GITHUB_STEP_SUMMARY"
